<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paste · {{.ID}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
  <header class="page-head paste-head">
    <div>
      <h1>Paste <span class="mono muted">{{.ID}}</span></h1>
      <p class="muted small">
        {{.Size}} bytes · created {{.CreatedAt}}
        {{if .OneTime}}· <strong>one-time (consumed)</strong>{{end}}
      </p>
    </div>
    <div class="paste-actions">
      {{if not .OneTime}}<button id="edit-toggle" class="link-btn">Edit</button>{{end}}
      <a href="/raw/{{.ID}}" class="link-btn">Raw</a>
      <a href="/" class="link-btn">← back</a>
    </div>
  </header>
  <pre id="view-content" class="paste">{{.Content}}</pre>
  {{if not .OneTime}}
  <div id="edit-panel" class="edit-surface" hidden>
    <div class="edit-meta">
      <span class="edit-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Editing
      </span>
      <span id="edit-count" class="muted small mono"></span>
    </div>
    <textarea id="edit-content" class="edit-textarea" rows="14">{{.Content}}</textarea>
    <p id="edit-error" class="error small" hidden></p>
    <div class="toolbar-actions edit-actions">
      <button id="edit-cancel" class="ghost">Cancel</button>
      <button id="edit-save" class="primary">Save</button>
    </div>
  </div>
  {{end}}
</main>
{{if not .OneTime}}
<script>
const TOKEN_KEY = 'selftmp_token';
const ID = {{.ID}};

const viewContent = document.getElementById('view-content');
const editToggle = document.getElementById('edit-toggle');
const editPanel = document.getElementById('edit-panel');
const editContent = document.getElementById('edit-content');
const editCount = document.getElementById('edit-count');
const editError = document.getElementById('edit-error');
const editSave = document.getElementById('edit-save');
const editCancel = document.getElementById('edit-cancel');

function getToken() { return (localStorage.getItem(TOKEN_KEY) || '').trim(); }

// Sizes the textarea to hug its content on both axes. Width uses CSS `ch`
// units rather than a JS pixel measurement: .edit-textarea is monospace, so
// 1ch is exactly one character's width in the font actually used for layout
// — no separate mirror/canvas measurement to fall out of sync with it. (A
// hidden mirror <div> and a scrollWidth-based measurement were both tried
// and both drifted from the real textarea's rendered width in some cases.)
// Height is measured after the width is set, since narrower width means more
// wrapped lines; collapsing to 0px first is needed because a textarea's
// height:auto falls back to the rows attribute rather than shrinking to fit.
// overflow-y is forced to 'hidden' for the whole calculation: collapsing to
// 0px to measure scrollHeight momentarily makes the box shorter than its
// content, and overflow-y:auto would reserve a vertical scrollbar gutter
// right at that moment — eating into the width available for text and
// throwing off both the width and height results. Restoring 'auto' at the
// end still lets genuinely tall content (past max-height) scroll normally.
function autoGrow() {
  editContent.style.overflowY = 'hidden';

  const cs = getComputedStyle(editContent);
  const hPad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
    parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  const maxChars = editContent.value.split('\n').reduce((m, l) => Math.max(m, l.length), 0);
  editContent.style.width = `max(160px, min(calc(${maxChars}ch + ${hPad + 4}px), 100%))`;

  const vBorder = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  editContent.style.height = '0px';
  editContent.style.height = (editContent.scrollHeight + vBorder) + 'px';

  editContent.style.overflowY = '';
}
function updateCount() {
  editCount.textContent = editContent.value.length.toLocaleString() + ' chars';
}
editContent.addEventListener('input', () => { autoGrow(); updateCount(); });

editToggle.addEventListener('click', () => {
  let token = getToken();
  if (!token) {
    token = (prompt('Admin token:') || '').trim();
    if (!token) return;
    localStorage.setItem(TOKEN_KEY, token);
  }
  editContent.value = viewContent.textContent;
  viewContent.hidden = true;
  editToggle.hidden = true;
  editPanel.hidden = false;
  editError.hidden = true;
  autoGrow();
  updateCount();
  editContent.focus();
});

editCancel.addEventListener('click', closeEdit);

function closeEdit() {
  editPanel.hidden = true;
  viewContent.hidden = false;
  editToggle.hidden = false;
}

editSave.addEventListener('click', async () => {
  const token = getToken();
  editError.hidden = true;
  const res = await fetch('/api/entries/' + encodeURIComponent(ID), {
    method: 'PATCH',
    headers: {
      'X-Admin-Token': token,
      'Content-Type': 'application/x-www-form-urlencoded',
      'Accept': 'application/json',
    },
    body: new URLSearchParams({content: editContent.value}).toString(),
  });
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    editError.textContent = 'Invalid admin token';
    editError.hidden = false;
    return;
  }
  if (!res.ok) {
    editError.textContent = 'Save failed: ' + (await res.text());
    editError.hidden = false;
    return;
  }
  const updated = await res.json();
  viewContent.textContent = updated.content;
  closeEdit();
});
</script>
{{end}}
</body>
</html>
